name: Rust CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Format Check
      run: cargo fmt --all -- --check
    - name: Clippy (Lint)
      run: cargo clippy -- -D warnings
    - name: Run Tests
      run: cargo test --verbose